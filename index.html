<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Websites</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff;
    }
    a {
      display: inline-block;
      padding: 16px 28px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
    }
    a:hover {
      background: #1f2937;
    }
  </style>
</head>
<body>
  <a href="#" onclick="openSites(); return false;">Open both websites</a>

  <script>
    function openSites() {
      window.open('real.html', 'zamaza_real');
      window.open('fake.html', 'zamaza_fake');
    }
  </script>
</body>
</html>
